# --- Go ---------------------------------------------------------------------

# gopls publishes no binaries. It is built at packaging time with
# `go install` for the target platform (pure Go, cross-compiles without
# cgo); the module is checked against `sum` (the Go checksum database
# entry). Without Go on the packaging machine gopls is left out with a note:
# it needs the Go toolchain at run time anyway, so anyone who can use it can
# also install it from the Languages page.
[[server]]
name = "gopls"
version = "v0.24.0"
languages = ["go", "gomod"]
license = "BSD-3-Clause"
homepage = "https://go.dev/gopls"
source = "go"
module = "golang.org/x/tools/gopls"
sum = "h1:nPO/LffYa4sP62Ueuema5PPnZPGaZjGl+vZGvbTek4g="
go = "1.27.0"
commands = [{ name = "gopls", exec = "bin/gopls" }]
licenses = [{ path = "LICENSE" }]

