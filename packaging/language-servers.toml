# The language servers bundled with Arcode releases.
#
# scripts/fetch-language-servers.sh reads this file, downloads what one
# platform needs, checks every download against the sha256 below (a
# mismatch stops the script) and lays it out as
#
#   <dest>/language-servers/
#       manifest.toml      a copy of this file; the app reads `commands`
#       bin/               single-file servers (rust-analyzer, taplo, ...)
#       lib/<name>/        servers that are a folder (clangd, jdtls, ...)
#       lib/npm/           the npm servers (package.json, lockfile, node_modules)
#       node/              the Node.js runtime the npm servers run on
#       LICENSES/          the license of everything above
#
# Every version is pinned. To update a server, change its version, URLs and
# sha256 values together (and for npm servers packaging/npm/package.json and
# its lockfile); `cargo test -p arcode-project bundled` checks the file.
#
# Platforms: linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64.
#
# Per server:
#   source    "archive" (one download per platform), "npm" (installed from
#             packaging/npm with its lockfile), "go" (built with `go install`
#             at packaging time; skipped with a note when Go is missing)
#   install   archive only: `file = "bin/<name>"` keeps one executable
#             (".exe" is added on Windows; `member` names it inside a zip or
#             tar), `dir = "lib/<name>"` unpacks everything there (`strip`
#             leading folders removed)
#   commands  what the app may run: `exec` (a native program, ".exe" added
#             on Windows), `node` (a script run with the bundled Node.js) or
#             `java` (jdtls, run with the user's Java)
#   licenses  license files: `path` inside the unpacked archive (or Go
#             module), or `url`
#             with its sha256 for archives that do not contain one
#   unsupported  platforms without an upstream build (with `note`)

schema = 1

[node]
version = "24.22.2"
license = "MIT"
homepage = "https://nodejs.org"
licenses = [{ path = "LICENSE" }]

[node.platforms.linux-x64]
