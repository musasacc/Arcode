# Arcode configuration
#
# This file lists every option with its default value. Delete any line to go
# back to the built-in default; unknown keys and invalid values are reported
# as warnings and never stop Arcode from starting.

[editor]
# Code font. JetBrains Mono ships with Arcode.
font_family = "JetBrains Mono"
# Fonts tried, in order, for characters missing from font_family
# (CJK, emoji, ...).
font_fallbacks = ["Noto Sans CJK SC", "Noto Color Emoji", "Segoe UI Emoji", "Apple Color Emoji"]
# Font size in points (4 - 200).
font_size = 14.0
# Line height as a multiple of the font size (0.5 - 4.0).
line_height = 1.5
# Programming ligatures such as -> and !=.
ligatures = true
# Width of a tab stop in columns (1 - 32).
tab_size = 4
# Insert spaces when pressing Tab.
insert_spaces = true
show_line_numbers = true
highlight_current_line = true
cursor_blink = false
# Soft-wrap long lines at the edge of the editor.
word_wrap = false
# "default" or "vim".
keymap = "default"
# Insert the closing bracket or quote automatically.
auto_close_brackets = true
# Format the file when saving.
format_on_save = false

[ui]
# UI font. Leave unset to use the system UI font.
# font_family = "Inter"
font_size = 13.0
# "system" (follow the OS), "dark", "light" or the name of a theme.
theme = "system"
# Themes used by "system", "dark" and "light". Built-in themes:
# "Arcode Dark", "Arcode Light", "Arcode Midnight". Put your own themes as
# .toml files in the "themes" folder next to this file.
dark_theme = "Arcode Dark"
light_theme = "Arcode Light"
# Reduce visual effects on slow machines (also disables animations).
low_end_mode = false
animations = true
# Animation duration in milliseconds.
animation_ms = 120
# Show frame time and memory use in the status bar.
show_perf_stats = true

[terminal]
# Shell program. Unset: $SHELL on Linux/macOS, PowerShell on Windows.
# shell = "/bin/zsh"
# Arguments passed to the shell.
args = []
# Font family and size. Unset: same as the editor.
# font_family = "JetBrains Mono"
# font_size = 13.0
# Lines of scrollback history.
scrollback = 10000

# Per-language settings. Built-in assignments:
#   rust -> rust-analyzer, typescript/javascript/tsx/jsx ->
#   typescript-language-server, python -> pyright-langserver, go -> gopls,
#   c/cpp -> clangd, toml -> taplo, json -> vscode-json-language-server.
# Any key you set replaces the built-in value for that language only.
#
# [language.python]
# servers = ["pyright-langserver", "ruff"]   # LSP servers, in order
# formatter = "black -q -"                   # external formatter command
# tab_size = 4                               # overrides editor.tab_size
# insert_spaces = true                       # overrides editor.insert_spaces

# Language servers. Built-in: rust-analyzer, typescript-language-server,
# pyright-langserver, gopls, clangd, taplo, vscode-json-language-server.
# A new table defines a new server; keys in an existing one override it.
#
# [lsp.ruff]
# command = "ruff"                           # defaults to the table name
# args = ["server"]
# env = { RUFF_CACHE_DIR = "/tmp/ruff" }
# root_markers = ["pyproject.toml", "ruff.toml"]
# initialization_options = { settings = { lineLength = 100 } }
