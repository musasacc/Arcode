# Arcode configuration
#
# This file lists every option with its default value. Delete any line to go
# back to the built-in default; unknown keys and invalid values are reported
# as warnings and never stop Arcode from starting.

[editor]
# Code font. JetBrains Mono ships with Arcode.
font_family = "JetBrains Mono"
# Fonts tried, in order, for characters missing from font_family
# (CJK, emoji, ...).
font_fallbacks = ["Noto Sans CJK SC", "Noto Color Emoji", "Segoe UI Emoji", "Apple Color Emoji"]
# Font size in points (4 - 200).
font_size = 14.0
# Line height as a multiple of the font size (0.5 - 4.0).
line_height = 1.5
# Programming ligatures such as -> and !=.
ligatures = true
# Width of a tab stop in columns (1 - 32).
tab_size = 4
# Insert spaces when pressing Tab.
insert_spaces = true
# Guess tabs or spaces and the indent size of each opened file from its
# content; the status bar shows (and lets you change) what a file uses.
detect_indentation = true
show_line_numbers = true
highlight_current_line = true
cursor_blink = false
# Soft-wrap long lines at the edge of the editor.
word_wrap = false
# "default" or "vim".
keymap = "default"
# Modal Vim editing: Normal, Insert, Visual and Replace modes, operators,
# text objects, registers ("+ is the system clipboard), dot repeat, / and ?
# search, :w :q :wq :e :s. "Editor: Toggle Vim Mode" switches it for the
# session.
vim_mode = false
# Insert the closing bracket or quote automatically.
auto_close_brackets = true
# Format the file with its language server when saving. Saving never
# waits longer than format_on_save_timeout_ms for the formatter.
format_on_save = false
format_on_save_timeout_ms = 1500
# Files this large (bytes or lines) keep no full syntax tree; only the
# visible region is parsed for highlighting, which keeps memory low.
large_file_bytes = 4194304
large_file_lines = 50000
# Show documentation when the mouse rests on a symbol (Ctrl+K Ctrl+I shows
# it at the cursor), after this many milliseconds.
hover = true
hover_delay_ms = 300
# Highlight the other occurrences of the symbol under the cursor.
occurrence_highlight = true
# Show type and parameter hints from the language server inside the code
# ("Editor: Toggle Inlay Hints" switches them for the session).
inlay_hints = true
# Show a light bulb in the gutter when code actions exist on the cursor line.
code_action_lightbulb = true

[editor.completion]
# Open the completion popup while typing. When false, only Ctrl+Space
# opens it.
auto_trigger = true
# Wait this long (ms) after a keystroke before asking for completions.
delay_ms = 50
# Offer built-in snippets and your own from snippets.toml (next to this
# file) in the popup.
snippets = true
# Show parameter hints after typing ( or , in a call.
signature_help = true

[ui]
# UI font. Leave unset to use the system UI font.
# font_family = "Inter"
font_size = 13.0
# "system" (follow the OS), "dark", "light" or the name of a theme.
theme = "system"
# Themes used by "system", "dark" and "light". Built-in themes:
# "Arcode Dark", "Arcode Light", "Arcode Midnight". Put your own themes as
# .toml files in the "themes" folder next to this file.
dark_theme = "Arcode Dark"
light_theme = "Arcode Light"
# Reduce visual effects on slow machines: no animations, no cursor blink,
# flat popups without shadows and slower (longer debounced) diagnostics and
# git refreshes. Inlay hints and inline blame are off unless set here. The
# Settings page turns those set to true off, tagged "[low-end mode]", and
# turning low-end mode off turns only the tagged ones back on.
low_end_mode = false
animations = true
# Animation duration in milliseconds.
animation_ms = 120
# Show frame time and memory use in the status bar.
show_perf_stats = true

[terminal]
# Shell program. Unset: $SHELL on Linux/macOS, PowerShell on Windows.
# shell = "/bin/zsh"
# Arguments passed to the shell.
args = []
# Font family and size. Unset: same as the editor.
# font_family = "JetBrains Mono"
# font_size = 13.0
# Lines of scrollback history.
scrollback = 10000

[git]
# Added / modified / deleted bars in the editor gutter (vs the index).
gutter = true
# Author, date and summary of the cursor line, shown at its end.
inline_blame = true
# How long the cursor rests on a line before its blame appears (ms).
inline_blame_delay_ms = 500

[search]
# A project search stops after this many matches ("Show more" raises it).
max_results = 2000
# How long to wait after the last keystroke before searching (ms).
debounce_ms = 250
# Skip what .gitignore / .ignore list.
respect_gitignore = true
# Also search hidden files and folders (dot files).
include_hidden = false
# Globs always excluded from project search, e.g. ["*.min.js", "dist"].
exclude = []

[todo]
# Comment tags listed in the TODO view (case-sensitive, whole words).
tags = ["TODO", "FIXME", "HACK", "XXX", "BUG", "NOTE"]

[workspace]
# Reopen a project's tabs, splits, cursors and panels when it is opened.
restore_session = true
# Reopen the projects that were open at quit (one window each) when Arcode
# starts without a path.
reopen_projects = true
# Ask before deleting files in the file tree.
confirm_delete = true
# Show changes made outside Arcode in the file tree (no polling).
watch_files = true
# Folder offered for new projects. Unset: next to the current project.
# projects_folder = "~/Projects"
# Show a banner when the project's packages are not installed (e.g.
# package.json without node_modules, requirements.txt without a
# virtualenv). Nothing is installed unless you click "Install packages".
package_banner = true

[files]
# File pattern -> language id (or name). A pattern without "/" matches the
# file name, one with "/" the path; * and ? are wildcards. The most
# specific matching pattern wins. The language picker in the status bar
# can add entries here.
# Example: { "*.mdx" = "markdown", "Dockerfile.*" = "shellscript" }
associations = {}

[debug]
# Run / Debug buttons next to main functions and tests in the gutter.
run_buttons = true
# Show the Debug panel when a debug session starts.
open_panel_on_start = true
# Preferred debug adapter per language: codelldb, lldb-dap, gdb (14+),
# debugpy or delve. Unset: the first one installed. Adapters are never
# downloaded; install them yourself. Example: { rust = "gdb" }
adapters = {}
# Adapter executables that are not on PATH, by adapter name.
# Example: { "lldb-dap" = "/usr/bin/lldb-dap-18" }
adapter_paths = {}

[plugins]
# Master switch for plugin network access. Off: every plugin request is
# refused. On: a plugin sends only when you click, and asks before it
# contacts a host for the first time.
network = true

# Per-language settings. Built-in assignments:
#   rust -> rust-analyzer, typescript/javascript (and their React variants)
#   -> typescript-language-server, python -> pyright-langserver,
#   go -> gopls, c/cpp -> clangd, toml -> taplo,
#   json/html/css -> vscode-{json,html,css}-language-server,
#   shellscript -> bash-language-server, yaml -> yaml-language-server,
#   markdown -> marksman, java -> jdtls, lua -> lua-language-server,
#   ruby -> ruby-lsp, php -> intelephense.
# Any key you set replaces the built-in value for that language only.
#
# Several servers can serve one file: diagnostics, completion and code
# actions come from all of them; hover, definition, rename, formatting and
# signature help ask them in this order until one has an answer.
#
# [language.python]
# enabled = true                             # false turns the language pack off
# servers = ["pyright-langserver", "ruff"]   # LSP servers, in priority order
# formatter = "black -q -"                   # external formatter command
# tab_size = 4                               # overrides editor.tab_size
# insert_spaces = true                       # overrides editor.insert_spaces

# Language servers. Built-in: rust-analyzer, typescript-language-server,
# pyright-langserver, gopls, clangd, taplo, vscode-json-language-server,
# vscode-html-language-server, vscode-css-language-server,
# bash-language-server, yaml-language-server, marksman, jdtls,
# lua-language-server, ruby-lsp, intelephense. The Languages page (Plugins
# view) shows which are installed and how to install them.
# A new table defines a new server; keys in an existing one override it.
#
# [lsp.ruff]
# command = "ruff"                           # defaults to the table name
# args = ["server"]
# env = { RUFF_CACHE_DIR = "/tmp/ruff" }
# root_markers = ["pyproject.toml", "ruff.toml"]
# initialization_options = { settings = { lineLength = 100 } }
# # Features to use from this server (all on by default): diagnostics,
# # completion, hover, signature_help, definition, references, symbols,
# # highlights, rename, formatting, code_actions, inlay_hints.
# features = { hover = false, completion = false }
#
# Saving this file applies LSP changes at once: only servers whose settings
# changed are restarted (a file with a TOML syntax error keeps the running
# setup). A missing server is reported once; nothing is ever downloaded or
# installed automatically.
