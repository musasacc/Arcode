[package]
name = "arcode"
description = "The Arcode IDE application: workspace shell, welcome screen and wiring."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "arcode"
path = "src/main.rs"
test = false

[features]
default = ["plugins"]
# The WASM plugin system (docs/PLUGINS.md §2); without it wasmtime and the
# plugin host are not built.
plugins = ["dep:arcode-plugin-host", "dep:globset"]

[dependencies]
gpui.workspace = true
arcode-buffer.workspace = true
arcode-syntax.workspace = true
arcode-lsp.workspace = true
arcode-terminal.workspace = true
arcode-config.workspace = true
arcode-git.workspace = true
arcode-project.workspace = true
arcode-dap.workspace = true
arcode-search.workspace = true
arcode-editor.workspace = true
arcode-completion.workspace = true
arcode-terminal-view.workspace = true
arcode-ui-kit.workspace = true
anyhow.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
ignore.workspace = true
nucleo-matcher.workspace = true
memory-stats.workspace = true
notify.workspace = true
async-channel.workspace = true
unicode-width.workspace = true
arcode-plugin-host = { workspace = true, optional = true }
globset = { workspace = true, optional = true }

# Placing restored windows on X11 (GPUI sets no position hint there).
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
x11rb = "0.13"
raw-window-handle = "0.6"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
