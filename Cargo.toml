[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/musasacc/Arcode"
rust-version = "1.90"

[workspace.dependencies]
# GUI: pinned exactly. Bumping GPUI is a deliberate, reviewed change.
gpui = { version = "=0.2.2" }

arcode-buffer = { path = "crates/arcode-buffer" }
arcode-syntax = { path = "crates/arcode-syntax" }
arcode-lsp = { path = "crates/arcode-lsp" }
arcode-terminal = { path = "crates/arcode-terminal" }
arcode-config = { path = "crates/arcode-config" }
arcode-git = { path = "crates/arcode-git" }
arcode-editor = { path = "crates/arcode-editor" }
arcode-terminal-view = { path = "crates/arcode-terminal-view" }
arcode-ui-kit = { path = "crates/arcode-ui-kit" }

ropey = "1.6.1"
tree-sitter = "0.25"
streaming-iterator = "0.1.9"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-json = "0.24"
lsp-types = "0.97"
tokio = "1.48"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "6"
alacritty_terminal = "0.26"
async-channel = "2"
futures = "0.3"
tempfile = "3"

[profile.dev]
# GPUI is unusably slow unoptimized; keep deps fast, our code debuggable.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
