[package]
name = "http-client"
description = "Arcode bundled plugin: send requests from .http / .rest files (docs/PLUGINS.md §9)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The wasm32-wasip2 component. Native `cargo test` builds the same source
# against the SDK's fakes (the export is wasm-only, see lib.rs).
crate-type = ["cdylib"]

[dependencies]
arcode-plugin.workspace = true
serde.workspace = true
serde_json.workspace = true
